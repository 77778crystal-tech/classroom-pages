<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Pages</title>
    <style>
      :root {
        color: #172033;
        background: #f8f4ea;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(90deg, rgba(23, 32, 51, .04) 1px, transparent 1px),
          linear-gradient(rgba(23, 32, 51, .04) 1px, transparent 1px),
          radial-gradient(circle at 10% 15%, rgba(251, 146, 60, .32), transparent 20rem),
          radial-gradient(circle at 90% 20%, rgba(20, 184, 166, .24), transparent 22rem),
          #f8f4ea;
        background-size: 28px 28px, 28px 28px, auto, auto, auto;
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      header {
        margin-bottom: 28px;
        padding: 34px;
        border: 1px solid rgba(23, 32, 51, .1);
        border-radius: 10px;
        background: rgba(255, 252, 244, .86);
        box-shadow: 0 22px 52px rgba(65, 52, 30, .12);
      }

      p {
        margin: 0 0 10px;
        color: #b45309;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 6vw, 72px);
        line-height: 1.04;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      a {
        min-height: 220px;
        display: grid;
        align-content: end;
        padding: 28px;
        border: 1px solid rgba(23, 32, 51, .1);
        border-radius: 10px;
        background: rgba(255, 255, 255, .86);
        color: inherit;
        text-decoration: none;
        box-shadow: 0 18px 42px rgba(53, 44, 31, .12);
        transition: transform .18s ease, box-shadow .18s ease;
      }

      a:hover {
        transform: translateY(-6px);
        box-shadow: 0 26px 48px rgba(53, 44, 31, .16);
      }

      span {
        width: max-content;
        margin-bottom: 18px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #172033;
        color: #fff;
        font-size: 14px;
        font-weight: 950;
      }

      h2 {
        margin: 0;
        font-size: clamp(26px, 3.6vw, 40px);
        line-height: 1.12;
      }

      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p>Classroom Pages</p>
        <h1>课堂网页合集</h1>
      </header>

      <section class="grid" aria-label="课堂网页列表">
        <a href="./tense-review/">
          <span>Grammar</span>
          <h2>四大基本时态复习充电卡</h2>
        </a>
        <a href="./workplace-english-cards/">
          <span>Audio Cards</span>
          <h2>Workplace English Cards</h2>
        </a>
      </section>
    </main>
  </body>
</html>
