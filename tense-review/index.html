<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四大基本时态复习充电卡</title>
    <script type="module" crossorigin src="./assets/index-Cd8xaxQJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CnWNGjiv.css">
  </head>
  <body>
    <main class="lesson-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">课前快速回顾</p>
          <h1 id="page-title">四大基本时态 · 职场选择充电卡</h1>
        </div>
      </section>

      <section class="recharge-board" aria-label="Tense review cards">
        <aside class="timeline" aria-label="Tense timeline">
          <button class="timeline-step is-active" data-card="0" type="button">
            <span>Now</span>
            <strong>事实 / 规律</strong>
          </button>
          <button class="timeline-step" data-card="1" type="button">
            <span>Past</span>
            <strong>已发生</strong>
          </button>
          <button class="timeline-step" data-card="2" type="button">
            <span>Ongoing</span>
            <strong>正在推进</strong>
          </button>
          <button class="timeline-step" data-card="3" type="button">
            <span>Result</span>
            <strong>完成影响现在</strong>
          </button>
        </aside>

        <div class="deck-wrap">
          <div class="deck-toolbar">
            <button class="icon-btn" data-action="prev" type="button" aria-label="Previous card">‹</button>
            <div class="progress-track" aria-label="Review progress">
              <span id="progressFill"></span>
            </div>
            <button class="icon-btn" data-action="next" type="button" aria-label="Next card">›</button>
          </div>

          <div class="deck" id="deck" tabindex="0" aria-live="polite"></div>

          <div class="card-dots" aria-label="Card navigation">
            <button class="is-active" data-card="0" type="button" aria-label="Present Simple"></button>
            <button data-card="1" type="button" aria-label="Past Simple"></button>
            <button data-card="2" type="button" aria-label="Present Continuous"></button>
            <button data-card="3" type="button" aria-label="Present Perfect"></button>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
